name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build web bundle
        run: |
          npx tsc --noEmit
          npm run build

      - name: Package Web artifact
        run: |
          mkdir -p artifacts
          (cd dist && zip -r ../artifacts/SinavAtolyesi-Web.zip .)

      - name: Upload web dist & zip
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist/
            artifacts/SinavAtolyesi-Web.zip

  build-macos:
    needs: build-web
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Build macOS app icon (.icns)
        run: |
          mkdir -p build/AppIcon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size public/icon.png --out "build/AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double public/icon.png --out "build/AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns build/AppIcon.iconset -o build/AppIcon.icns

      - name: Compile native macOS host & assemble .app bundle
        run: |
          APP_DIR="build/Sınav Atölyesi.app"
          CONTENTS_DIR="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RES_DIR="$CONTENTS_DIR/Resources"
          mkdir -p "$MACOS_DIR" "$RES_DIR/deck" "$RES_DIR/assets"

          cp build/AppIcon.icns "$RES_DIR/AppIcon.icns"
          cp -R web-build/dist/assets/* "$RES_DIR/assets/"
          grep -v 'rel="icon"' web-build/dist/index.html > "$RES_DIR/deck/index.html"

          cat <<'SWIFT' > build/main.swift
          import AppKit
          import Foundation
          import UniformTypeIdentifiers
          import WebKit

          final class AppAssetSchemeHandler: NSObject, WKURLSchemeHandler {
            private let resourcesURL: URL

            init(resourcesURL: URL) {
              self.resourcesURL = resourcesURL
              super.init()
            }

            func webView(_ webView: WKWebView, start urlSchemeTask: WKURLSchemeTask) {
              guard let url = urlSchemeTask.request.url else {
                urlSchemeTask.didFailWithError(URLError(.badURL))
                return
              }
              let relPath = String(url.path.drop(while: { $0 == "/" }))
              let safePath = relPath.isEmpty ? "deck/index.html" : relPath
              let fileURL = resourcesURL.appendingPathComponent(safePath).standardizedFileURL
              let base = resourcesURL.standardizedFileURL.path
              guard fileURL.path.hasPrefix(base + "/"),
                    let data = try? Data(contentsOf: fileURL) else {
                let response = HTTPURLResponse(
                  url: url,
                  statusCode: 404,
                  httpVersion: "HTTP/1.1",
                  headerFields: ["Content-Length": "0"]
                )!
                urlSchemeTask.didReceive(response)
                urlSchemeTask.didFinish()
                return
              }

              let mime = Self.mimeType(for: fileURL.pathExtension)
              let headers = [
                "Content-Type": mime,
                "Content-Length": String(data.count),
                "Cache-Control": "no-cache"
              ]
              let response = HTTPURLResponse(
                url: url,
                statusCode: 200,
                httpVersion: "HTTP/1.1",
                headerFields: headers
              )!
              urlSchemeTask.didReceive(response)
              urlSchemeTask.didReceive(data)
              urlSchemeTask.didFinish()
            }

            func webView(_ webView: WKWebView, stop urlSchemeTask: WKURLSchemeTask) {}

            private static func mimeType(for ext: String) -> String {
              switch ext.lowercased() {
              case "html", "htm": return "text/html; charset=utf-8"
              case "js", "mjs": return "text/javascript; charset=utf-8"
              case "css": return "text/css; charset=utf-8"
              case "json": return "application/json; charset=utf-8"
              case "svg": return "image/svg+xml"
              case "png": return "image/png"
              case "wasm": return "application/wasm"
              default:
                let type = UTType(filenameExtension: ext)?.preferredMIMEType ?? "application/octet-stream"
                return type.hasPrefix("text/") ? "\(type); charset=utf-8" : type
              }
            }
          }

          final class AppDelegate: NSObject, NSApplicationDelegate, WKUIDelegate, WKNavigationDelegate, WKDownloadDelegate {
            private var window: NSWindow!
            private var webView: WKWebView!

            func applicationDidFinishLaunching(_ notification: Notification) {
              guard let resourcesURL = Bundle.main.resourceURL else {
                NSApp.terminate(nil)
                return
              }

              let config = WKWebViewConfiguration()
              config.setURLSchemeHandler(AppAssetSchemeHandler(resourcesURL: resourcesURL), forURLScheme: "exact-app")
              config.preferences.javaScriptCanOpenWindowsAutomatically = true

              webView = WKWebView(frame: NSRect(x: 0, y: 0, width: 1360, height: 860), configuration: config)
              webView.uiDelegate = self
              webView.navigationDelegate = self
              if #available(macOS 13.3, *) {
                webView.isInspectable = true
              }

              window = NSWindow(
                contentRect: NSRect(x: 0, y: 0, width: 1360, height: 860),
                styleMask: [.titled, .closable, .miniaturizable, .resizable],
                backing: .buffered,
                defer: false
              )
              window.title = "Sınav Atölyesi"
              window.minSize = NSSize(width: 900, height: 640)
              window.center()
              window.contentView = webView
              window.makeKeyAndOrderFront(nil)
              NSApp.activate(ignoringOtherApps: true)

              if let startURL = URL(string: "exact-app://app/deck/index.html") {
                webView.load(URLRequest(url: startURL))
              }
            }

            func applicationShouldTerminateAfterLastWindowClosed(_ sender: NSApplication) -> Bool {
              true
            }

            func webView(
              _ webView: WKWebView,
              runOpenPanelWith parameters: WKOpenPanelParameters,
              initiatedByFrame frame: WKFrameInfo,
              completionHandler: @escaping ([URL]?) -> Void
            ) {
              let panel = NSOpenPanel()
              panel.allowsMultipleSelection = parameters.allowsMultipleSelection
              panel.canChooseDirectories = parameters.allowsDirectories
              panel.canChooseFiles = true
              panel.beginSheetModal(for: window) { response in
                completionHandler(response == .OK ? panel.urls : nil)
              }
            }

            func webView(
              _ webView: WKWebView,
              runJavaScriptAlertPanelWithMessage message: String,
              initiatedByFrame frame: WKFrameInfo,
              completionHandler: @escaping () -> Void
            ) {
              let alert = NSAlert()
              alert.messageText = "Sınav Atölyesi"
              alert.informativeText = message
              alert.addButton(withTitle: "Tamam")
              alert.beginSheetModal(for: window) { _ in completionHandler() }
            }

            func webView(
              _ webView: WKWebView,
              runJavaScriptConfirmPanelWithMessage message: String,
              initiatedByFrame frame: WKFrameInfo,
              completionHandler: @escaping (Bool) -> Void
            ) {
              let alert = NSAlert()
              alert.messageText = "Sınav Atölyesi"
              alert.informativeText = message
              alert.addButton(withTitle: "Tamam")
              alert.addButton(withTitle: "Vazgeç")
              alert.beginSheetModal(for: window) { response in
                completionHandler(response == .alertFirstButtonReturn)
              }
            }

            func webView(
              _ webView: WKWebView,
              decidePolicyFor navigationAction: WKNavigationAction,
              decisionHandler: @escaping (WKNavigationActionPolicy) -> Void
            ) {
              if navigationAction.shouldPerformDownload {
                decisionHandler(.download)
                return
              }
              if let url = navigationAction.request.url,
                 let scheme = url.scheme?.lowercased(),
                 scheme == "http" || scheme == "https" {
                NSWorkspace.shared.open(url)
                decisionHandler(.cancel)
                return
              }
              decisionHandler(.allow)
            }

            func webView(_ webView: WKWebView, navigationAction: WKNavigationAction, didBecome download: WKDownload) {
              download.delegate = self
            }

            func download(
              _ download: WKDownload,
              decideDestinationUsing response: URLResponse,
              suggestedFilename: String,
              completionHandler: @escaping (URL?) -> Void
            ) {
              let panel = NSSavePanel()
              panel.nameFieldStringValue = suggestedFilename
              panel.beginSheetModal(for: window) { result in
                completionHandler(result == .OK ? panel.url : nil)
              }
            }
          }

          let app = NSApplication.shared
          app.setActivationPolicy(.regular)
          let delegate = AppDelegate()
          app.delegate = delegate
          app.run()
          SWIFT

          swiftc -O -target arm64-apple-macos13.0 \
            -Xlinker -no_adhoc_codesign \
            -framework AppKit -framework Foundation -framework UniformTypeIdentifiers -framework WebKit \
            build/main.swift -o "$MACOS_DIR/SinavAtolyesi"

          RAW_VER="${GITHUB_REF_NAME#v}"
          if [ -z "$RAW_VER" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            RAW_VER="1.0.0"
          fi

          cat <<PLIST > "$CONTENTS_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>tr</string>
            <key>CFBundleDisplayName</key>
            <string>Sınav Atölyesi</string>
            <key>CFBundleExecutable</key>
            <string>SinavAtolyesi</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.sinavatolyesi.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Sınav Atölyesi</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${RAW_VER}</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xattr -cr "$APP_DIR"
          codesign --sign - "$MACOS_DIR/SinavAtolyesi"
          codesign --force --sign - "$APP_DIR"
          codesign --verify --verbose=2 "$APP_DIR"

      - name: Package macOS ZIP & DMG
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "build/Sınav Atölyesi.app" artifacts/SinavAtolyesi-macOS-arm64.zip
          mkdir -p build/dmg-root
          cp -R "build/Sınav Atölyesi.app" build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "Sınav Atölyesi" -srcfolder build/dmg-root -ov -format UDZO artifacts/SinavAtolyesi-macOS-arm64.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: artifacts/

  build-windows:
    needs: build-web
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Build Windows icon (.ico) & native WebView2 host
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "win-host" | Out-Null

          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile((Resolve-Path "public/icon.png"))
          $bmp = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.DrawImage($src, 0, 0, 256, 256)
          $g.Dispose()
          $src.Dispose()
          $ms = New-Object System.IO.MemoryStream
          $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          $png = $ms.ToArray()
          $fs = [System.IO.File]::Create("win-host/AppIcon.ico")
          $bw = New-Object System.IO.BinaryWriter($fs)
          $bw.Write([uint16]0); $bw.Write([uint16]1); $bw.Write([uint16]1)
          $bw.Write([byte]0); $bw.Write([byte]0); $bw.Write([byte]0); $bw.Write([byte]0)
          $bw.Write([uint16]1); $bw.Write([uint16]32)
          $bw.Write([uint32]$png.Length); $bw.Write([uint32]22)
          $bw.Write($png)
          $bw.Close(); $fs.Close()

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <AssemblyName>SinavAtolyesi</AssemblyName>
              <AssemblyTitle>S&#x0131;nav At&#x00F6;lyesi</AssemblyTitle>
              <Product>S&#x0131;nav At&#x00F6;lyesi</Product>
              <ApplicationIcon>AppIcon.ico</ApplicationIcon>
              <PublishSingleFile>true</PublishSingleFile>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
              <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Web.WebView2" Version="1.0.2903.40" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Encoding UTF8 "win-host/SinavAtolyesi.csproj"

          @'
          using System.Diagnostics;
          using System.Drawing;
          using System.IO;
          using System.Windows.Forms;
          using Microsoft.Web.WebView2.Core;
          using Microsoft.Web.WebView2.WinForms;

          namespace SinavAtolyesi;

          internal static class Program
          {
              [STAThread]
              private static void Main()
              {
                  ApplicationConfiguration.Initialize();
                  Application.Run(new MainForm());
              }
          }

          internal sealed class MainForm : Form
          {
              private readonly WebView2 _webView;

              public MainForm()
              {
                  Text = "S\u0131nav At\u00f6lyesi";
                  Width = 1360;
                  Height = 860;
                  MinimumSize = new Size(900, 640);
                  StartPosition = FormStartPosition.CenterScreen;

                  try
                  {
                      Icon = Icon.ExtractAssociatedIcon(Application.ExecutablePath);
                  }
                  catch
                  {
                  }

                  _webView = new WebView2 { Dock = DockStyle.Fill };
                  Controls.Add(_webView);
                  Load += async (_, _) => await InitializeAsync();
              }

              private async Task InitializeAsync()
              {
                  var userDataDir = Path.Combine(
                      Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                      "SinavAtolyesi",
                      "WebView2"
                  );
                  Directory.CreateDirectory(userDataDir);

                  var env = await CoreWebView2Environment.CreateAsync(null, userDataDir);
                  await _webView.EnsureCoreWebView2Async(env);

                  var resourcesDir = Path.Combine(AppContext.BaseDirectory, "resources");
                  _webView.CoreWebView2.SetVirtualHostNameToFolderMapping(
                      "app.sinavatolyesi.local",
                      resourcesDir,
                      CoreWebView2HostResourceAccessKind.Allow
                  );

                  _webView.CoreWebView2.NewWindowRequested += (_, e) =>
                  {
                      if (!e.Uri.StartsWith("https://app.sinavatolyesi.local/", StringComparison.OrdinalIgnoreCase))
                      {
                          e.Handled = true;
                          Process.Start(new ProcessStartInfo(e.Uri) { UseShellExecute = true });
                      }
                  };

                  _webView.Source = new Uri("https://app.sinavatolyesi.local/deck/index.html");
              }
          }
          '@ | Set-Content -Encoding UTF8 "win-host/Program.cs"

          dotnet publish win-host/SinavAtolyesi.csproj -c Release -r win-x64 --self-contained true -o "build/SinavAtolyesi-win-x64"

          New-Item -ItemType Directory -Force -Path "build/SinavAtolyesi-win-x64/resources/deck", "build/SinavAtolyesi-win-x64/resources/assets" | Out-Null
          Copy-Item -Recurse -Force "web-build/dist/assets/*" "build/SinavAtolyesi-win-x64/resources/assets/"
          (Get-Content "web-build/dist/index.html") | Where-Object { $_ -notmatch 'rel="icon"' } | Set-Content -Encoding UTF8 "build/SinavAtolyesi-win-x64/resources/deck/index.html"

          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          Compress-Archive -Path "build/SinavAtolyesi-win-x64/*" -DestinationPath "artifacts/SinavAtolyesi-Windows-x64.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/

  release:
    needs: [build-web, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Gather release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
